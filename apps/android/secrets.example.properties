# secrets.properties 템플릿(이 example 파일은 커밋된다).
#
# 설정 방법:
#   1) 이 파일을 같은 폴더에 secrets.properties 로 복사한다(secrets.properties는 .gitignore됨).
#   2) 아래 값을 채운다. 빈 채로 두면 그 provider만 비활성이고 빌드·데모 로그인은 그대로 된다.
#
# 값은 공개 식별자(OAuth 클라이언트 ID·Kakao 앱 키)라 시크릿은 아니지만, 커밋 소스에서
# 분리해 둔다(iOS의 Config/Secrets.xcconfig와 같은 자리).
#
# 우선순위: gradle 프로퍼티(-P…) > 환경변수 > 이 파일. CI는 환경변수로 주면 된다.

# Google Cloud OAuth 2.0 **웹(서버)** 클라이언트 ID.
# 앱이 받는 id_token의 audience가 되며, 서버가 검증하는 값과 같아야 한다.
# (앱 자체는 별도로 Android 유형 클라이언트로 패키지명 + SHA-1을 등록해 둬야 한다 — README 참고)
prismGoogleServerClientId=

# Kakao developers ▸ 앱 키 ▸ **네이티브 앱 키**.
# SDK 초기화와 카카오톡 복귀 스킴(kakao{앱키}://oauth)에 쓴다.
prismKakaoNativeAppKey=

# API(auth 서비스) 주소. 비워 두면 debug는 배포된 개발 서버로 떨어진다(build.gradle.kts).
# 호스트에서 서버를 직접 띄웠을 때만 채운다 — 예: http://10.0.2.2:3000 (에뮬레이터)
prismApiUrl=
