# keystore.properties 템플릿(이 example 파일은 커밋된다).
#
# 릴리스(Play 업로드) 서명 키. 설정 방법:
#   1) 키스토어를 레포 **밖**에 만든다(한 번만; 잃어버리면 Play Console에서 업로드 키 재설정 절차를 거쳐야 한다):
#        keytool -genkeypair -keystore ~/.android/prism-upload.jks -alias prism-upload \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2) 이 파일을 같은 폴더에 keystore.properties 로 복사하고 값을 채운다(keystore.properties는 .gitignore됨).
#
# 파일이 없으면 릴리스는 서명 없이 빌드된다 — Play Console에는 못 올리지만 빌드는 깨지지 않는다
# (secrets.properties · google-services.json과 같은 규칙: 없는 사람도 빌드는 된다).
storeFile=/absolute/path/to/prism-upload.jks
storePassword=
keyAlias=prism-upload
keyPassword=
