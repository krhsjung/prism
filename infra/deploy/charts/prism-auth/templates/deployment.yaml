apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prism-auth.fullname" . }}
  labels:
    {{- include "prism-auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prism-auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # 이 값이 바뀌면 파드 템플릿이 바뀐 것이므로 쿠버네티스가 롤아웃한다.
        # (`latest` 태그만으로는 새 이미지를 밀어 넣어도 스펙이 그대로다)
        prism.dev/revision: {{ .Values.deployRevision | quote }}
      labels:
        {{- include "prism-auth.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PRISM_AUTH_PORT
              value: {{ .Values.env.authPort | quote }}
            - name: PRISM_CORS_ORIGIN
              value: {{ .Values.env.corsOrigin | quote }}
            - name: PRISM_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: jwt-secret-key
            # 세션 수명 — 미설정 시 코드 기본값(15m/12h). 비민감 값이라 일반 env로 둔다.
            - name: PRISM_JWT_ACCESS_TOKEN_EXPIRES_IN
              value: {{ .Values.env.jwtAccessTokenExpiresIn | quote }}
            - name: PRISM_JWT_REFRESH_TOKEN_EXPIRES_IN
              value: {{ .Values.env.jwtRefreshTokenExpiresIn | quote }}
            # 쿠키 이름 네임스페이스(빈 값이면 기본 이름). 발급·검증 양쪽이 같아야 한다.
            - name: PRISM_COOKIE_NAMESPACE
              value: {{ .Values.env.cookieNamespace | quote }}
            - name: PRISM_WEB_APP_URL
              value: {{ .Values.env.webAppUrl | quote }}
            - name: PRISM_NATIVE_AUTH_CALLBACK
              value: {{ .Values.env.nativeAuthCallback | quote }}
            - name: PRISM_GOOGLE_CLIENT_ID
              value: {{ .Values.env.googleClientId | quote }}
            - name: PRISM_GOOGLE_REDIRECT_URI
              value: {{ .Values.env.googleRedirectUri | quote }}
            - name: PRISM_APPLE_TEAM_ID
              value: {{ .Values.env.appleTeamId | quote }}
            - name: PRISM_APPLE_CLIENT_ID
              value: {{ .Values.env.appleClientId | quote }}
            - name: PRISM_APPLE_KEY_ID
              value: {{ .Values.env.appleKeyId | quote }}
            - name: PRISM_APPLE_BUNDLE_ID
              value: {{ .Values.env.appleBundleId | quote }}
            - name: PRISM_APPLE_REDIRECT_URI
              value: {{ .Values.env.appleRedirectUri | quote }}
            - name: PRISM_KAKAO_CLIENT_ID
              value: {{ .Values.env.kakaoClientId | quote }}
            - name: PRISM_KAKAO_REDIRECT_URI
              value: {{ .Values.env.kakaoRedirectUri | quote }}
            - name: PRISM_KAKAO_APP_ID
              value: {{ .Values.env.kakaoAppId | quote }}
            - name: PRISM_GOOGLE_NATIVE_AUDIENCES
              value: {{ .Values.env.googleNativeAudiences | quote }}
            - name: PRISM_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: google-client-secret
            - name: PRISM_APPLE_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: apple-private-key
            - name: PRISM_KAKAO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: kakao-client-secret
            - name: PRISM_DB_REQUIRED
              value: {{ .Values.env.dbRequired | quote }}
            - name: PRISM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: database-url
            - name: PRISM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: redis-url
            - name: PRISM_DATABASE_REPLICA_URLS
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-auth.fullname" . }}-secret
                  key: database-replica-urls
          # liveness는 /healthz(프로세스 응답 불능 시 재시작),
          # readiness는 /readyz — DB 필수 배포에선 master 장애 시 트래픽에서 빠진다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
