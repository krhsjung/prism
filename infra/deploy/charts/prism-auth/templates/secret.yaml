apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism-auth.fullname" . }}-secret
  labels:
    {{- include "prism-auth.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret-key: {{ required "PRISM_JWT_SECRET_KEY must be set" .Values.jwt.secretKey | b64enc | quote }}
  jwt-refresh-secret-key: {{ required "PRISM_JWT_REFRESH_SECRET_KEY must be set" .Values.jwt.refreshSecretKey | b64enc | quote }}
  # OAuth/DB 시크릿 — 미설정(빈 값) 허용. 빈 값이면 해당 provider/DB 기능 비활성.
  google-client-secret: {{ .Values.oauth.googleClientSecret | default "" | b64enc | quote }}
  apple-private-key: {{ .Values.oauth.applePrivateKey | default "" | b64enc | quote }}
  database-url: {{ .Values.database.url | default "" | b64enc | quote }}
