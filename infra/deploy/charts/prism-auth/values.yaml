# 값은 install.sh가 환경변수로 치환한다(${VAR:-default}). 시크릿은 env에서만 주입.
replicaCount: 1

# 배포 리비전(커밋 해시). 파드 템플릿 애노테이션에 들어가 롤아웃을 트리거한다 —
# `latest` 태그는 값이 바뀌어도 스펙이 그대로라 쿠버네티스가 재배포하지 않는다.
deployRevision: "${PRISM_DEPLOY_REVISION:-unset}"

image:
  repository: ${PRISM_REGISTRY:?set PRISM_REGISTRY}/prism-auth
  tag: "${PRISM_IMAGE_TAG:-latest}"
  pullPolicy: Always

# 레지스트리 pull 시크릿 이름 (install.sh가 네임스페이스에 생성)
imagePullSecret: prism-registry

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: ${PRISM_AUTH_NODEPORT:-30000}

env:
  authPort: "3000"
  corsOrigin: "https://${PRISM_SERVICE_DOMAIN}"
  # 세션 수명(선택). 미설정 시 코드 기본값(15m/12h). 표기: 900 또는 15m/12h/7d.
  jwtAccessTokenExpiresIn: "${PRISM_JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}"
  jwtRefreshTokenExpiresIn: "${PRISM_JWT_REFRESH_TOKEN_EXPIRES_IN:-12h}"
  # 쿠키 이름 네임스페이스(선택, 기본 없음). 한 호스트에 앱이 둘 이상일 때만.
  cookieNamespace: "${PRISM_COOKIE_NAMESPACE:-}"
  # 로그인 완료 후 브라우저를 되돌려보낼 웹 앱 주소.
  webAppUrl: "https://${PRISM_SERVICE_DOMAIN}"
  # 네이티브 웹-redirect(flow=native) 로그인이 일회용 코드를 돌려보낼 앱 커스텀 스킴.
  # 앱이 등록한 스킴과 같아야 한다(기본 prism://auth/callback).
  nativeAuthCallback: "${PRISM_NATIVE_AUTH_CALLBACK:-prism://auth/callback}"
  # 소셜 OAuth — 비시크릿 설정(미설정 시 빈 값 → 해당 provider 비활성).
  # redirect URI는 nginx가 /auth를 auth 서비스로 보내므로 도메인 기준으로 구성한다.
  googleClientId: "${PRISM_GOOGLE_CLIENT_ID:-}"
  googleRedirectUri: "https://${PRISM_SERVICE_DOMAIN}/auth/google/callback"
  appleTeamId: "${PRISM_APPLE_TEAM_ID:-}"
  appleClientId: "${PRISM_APPLE_CLIENT_ID:-}"
  appleKeyId: "${PRISM_APPLE_KEY_ID:-}"
  appleBundleId: "${PRISM_APPLE_BUNDLE_ID:-}"
  appleRedirectUri: "https://${PRISM_SERVICE_DOMAIN}/auth/apple/callback"
  kakaoClientId: "${PRISM_KAKAO_CLIENT_ID:-}"
  kakaoRedirectUri: "https://${PRISM_SERVICE_DOMAIN}/auth/kakao/callback"
  # Kakao 앱의 숫자 app_id — 네이티브 로그인(/auth/kakao/native)의 토큰 app_id 대조용.
  kakaoAppId: "${PRISM_KAKAO_APP_ID:-}"
  # Google 네이티브 id_token의 추가 audience(콤마 구분) — 웹 clientId는 자동 포함되므로 선택값.
  googleNativeAudiences: "${PRISM_GOOGLE_NATIVE_AUDIENCES:-}"
  # 운영 기본 true: DB 장애 시 부팅 실패 + readyz로 트래픽 차단. 데모(DB 없는) 배포만 false.
  dbRequired: "${PRISM_DB_REQUIRED:-true}"

# 시크릿: env → k8s Secret. JWT는 필수, OAuth/DB는 미설정 시 빈 값.
jwt:
  secretKey: "${PRISM_JWT_SECRET_KEY}"

oauth:
  googleClientSecret: "${PRISM_GOOGLE_CLIENT_SECRET:-}"
  # .p8 키 내용. 개행은 \n 이스케이프로 넣어도 앱이 복원한다.
  applePrivateKey: "${PRISM_APPLE_PRIVATE_KEY:-}"
  # Kakao 콘솔에서 "client secret 사용"을 켠 경우에만 필요(꺼져 있으면 빈 값).
  kakaoClientSecret: "${PRISM_KAKAO_CLIENT_SECRET:-}"

# DB(PostgreSQL) — 표준 접속 URL(12-factor DATABASE_URL). 비밀번호를 포함하므로 Secret으로 주입.
# replica URL(콤마 목록)이 있으면 replica 토폴로지, 없으면 single.
# 호스트는 kind 파드에서 닿는 주소여야 한다(예: host.docker.internal).
database:
  url: "${PRISM_DATABASE_URL:-postgres://prism@host.docker.internal:5432/prism}"
  replicaUrls: "${PRISM_DATABASE_REPLICA_URLS:-}"

# 세션 저장소(Redis). 접속 URL이 비밀번호를 포함하므로 통째로 Secret으로 주입한다.
# 세션이 여기에만 있으므로 연결 실패는 부팅 실패로 다룬다(readyz도 이 상태를 본다).
#
# 기본값을 두지 않는다. 인증 없는 URL을 기본값으로 두면 Helm의 required 검사를
# 통과해버려서, 렌더는 성공하는데 파드가 Redis 인증에 실패하는 배포가 만들어진다.
redis:
  url: "${PRISM_REDIS_URL:?PRISM_REDIS_URL must be set}"

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# FCM 서비스 계정. **셋은 함께 있거나 함께 없다** — 하나만 오면 서버가 부팅에서 막는다.
# 없으면 푸시가 비활성이고, 목록의 `pushRegistered`가 전부 false로 접혀 화면이
# 거짓말하지 않는다(app-config.ts의 loadFcmConfig).
#
# 비공개 키는 **클라이언트에게 나가지 않는다** — 나가는 것은 이 키로 받아 온 액세스
# 토큰이 붙은 서버 → FCM 요청뿐이다. env에서는 개행이 `\n`으로 눌려 오고 서버가 되돌린다.
fcm:
  projectId: "${PRISM_FCM_PROJECT_ID:-}"
  clientEmail: "${PRISM_FCM_CLIENT_EMAIL:-}"
  privateKey: "${PRISM_FCM_PRIVATE_KEY:-}"
