# 값은 install.sh가 환경변수로 치환한다(${VAR:-default}).
#
# ⚠️ **1로 고정한다.** presence 자체는 공유 Redis에 있어 파드를 늘려도 배지는 정확하지만,
# `sessionsChanged` 알림은 프로세스 메모리의 연결 목록으로 보낸다(ConnectionRegistry).
# 파드가 둘이면 다른 파드에 붙은 클라이언트는 알림을 못 받아 목록이 실시간으로 갱신되지
# 않고, 사용자가 직접 당겨서 새로고침해야 한다 — 자동으로 회복되지 않는다.
# 늘리려면 먼저 Redis pub/sub으로 승격할 것(connection-registry.ts 주석 참고).
replicaCount: 1

# 배포 리비전(커밋 해시). 파드 템플릿 애노테이션에 들어가 롤아웃을 트리거한다 —
# `latest` 태그는 값이 바뀌어도 스펙이 그대로라 쿠버네티스가 재배포하지 않는다.
deployRevision: "${PRISM_DEPLOY_REVISION:-unset}"

image:
  repository: ${PRISM_REGISTRY:?set PRISM_REGISTRY}/prism-socket
  tag: "${PRISM_IMAGE_TAG:-latest}"
  pullPolicy: Always

imagePullSecret: prism-registry

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: ${PRISM_SOCKET_NODEPORT:-30002}

env:
  socketPort: "3000"
  corsOrigin: "https://${PRISM_SERVICE_DOMAIN}"
  # socket은 쓰지 않지만 공통 설정 로더가 운영에서 필수로 검증한다(auth와 동일 값).
  webAppUrl: "https://${PRISM_SERVICE_DOMAIN}"
  # 쿠키 이름 네임스페이스(선택, 기본 없음). 세션 쿠키를 읽으려면 발급(auth)과 **같은**
  # 값이어야 한다 — 갈리면 웹 소켓이 쿠키를 못 찾아 전부 UNAUTHORIZED로 닫힌다.
  cookieNamespace: "${PRISM_COOKIE_NAMESPACE:-}"

# 시크릿: env → k8s Secret.
#
# socket은 세션을 발급하지 않고 **검증만** 하지만, 검증에는 auth와 **같은** 서명 키와
# **같은** 세션 저장소가 필요하다. 값이 갈리면 로그인은 되는데 소켓만 전부 닫힌다.
jwt:
  secretKey: "${PRISM_JWT_SECRET_KEY}"

# 세션 저장소 겸 presence 저장소. 이 서비스는 Redis 없이는 아무 일도 못 한다 —
# 그래서 readiness가 /readyz(redis.ping)를 본다.
redis:
  url: "${PRISM_REDIS_URL:?PRISM_REDIS_URL must be set}"

# Postgres는 **없다.** 이 서비스는 사용자 행을 조회하지 않는다 — 세션도 presence도
# Redis에만 있다(@app/common의 SessionsModule / UsersModule 분리).

resources:
  limits:
    cpu: 300m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
