apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism-socket.fullname" . }}-secret
  labels:
    {{- include "prism-socket.labels" . | nindent 4 }}
type: Opaque
data:
  # socket은 세션을 **발급하지 않지만 검증한다.** auth와 같은 키·같은 저장소를 봐야 하며,
  # 하나라도 갈리면 "로그인은 되는데 소켓은 전부 닫힌다"가 된다.
  jwt-secret-key: {{ required "PRISM_JWT_SECRET_KEY must be set" .Values.jwt.secretKey | b64enc | quote }}
  # 세션 생존 확인과 presence가 모두 여기 있다 — 이 서비스의 유일한 저장소다.
  redis-url: {{ required "PRISM_REDIS_URL must be set" .Values.redis.url | b64enc | quote }}
  # **required가 아니다** — TURN은 선택이고, 없으면 서버가 공개 STUN으로 떨어진다.
  # 다만 URL과 둘이 어긋나면 부팅에서 막힌다(app-config.ts).
  #
  # coturn의 `static-auth-secret`과 **같은 값**이어야 한다. 이 비밀 자체는 클라이언트에게
  # 나가지 않고, 소켓이 통화마다 이것으로 시한부 자격증명을 서명해 내려준다.
  turn-secret: {{ .Values.turn.secret | default "" | b64enc | quote }}
  # **required가 아니다** — 푸시는 선택이고, 없으면 서버는 뜨되 아무도 깨우지 못한다.
  # 다만 셋 중 일부만 오면 부팅에서 막힌다(app-config.ts).
  fcm-private-key: {{ .Values.fcm.privateKey | default "" | b64enc | quote }}
