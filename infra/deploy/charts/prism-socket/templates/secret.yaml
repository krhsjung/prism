apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism-socket.fullname" . }}-secret
  labels:
    {{- include "prism-socket.labels" . | nindent 4 }}
type: Opaque
data:
  # socket은 세션을 **발급하지 않지만 검증한다.** auth와 같은 키·같은 저장소를 봐야 하며,
  # 하나라도 갈리면 "로그인은 되는데 소켓은 전부 닫힌다"가 된다.
  jwt-secret-key: {{ required "PRISM_JWT_SECRET_KEY must be set" .Values.jwt.secretKey | b64enc | quote }}
  # 세션 생존 확인과 presence가 모두 여기 있다 — 이 서비스의 유일한 저장소다.
  redis-url: {{ required "PRISM_REDIS_URL must be set" .Values.redis.url | b64enc | quote }}
