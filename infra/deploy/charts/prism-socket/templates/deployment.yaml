apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prism-socket.fullname" . }}
  labels:
    {{- include "prism-socket.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "prism-socket.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # 이 값이 바뀌면 파드 템플릿이 바뀐 것이므로 쿠버네티스가 롤아웃한다.
        # (`latest` 태그만으로는 새 이미지를 밀어 넣어도 스펙이 그대로다)
        prism.dev/revision: {{ .Values.deployRevision | quote }}
      labels:
        {{- include "prism-socket.selectorLabels" . | nindent 8 }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: PRISM_SOCKET_PORT
              value: {{ .Values.env.socketPort | quote }}
            - name: PRISM_CORS_ORIGIN
              value: {{ .Values.env.corsOrigin | quote }}
            # socket은 이 값을 쓰지 않지만(OAuth redirect는 auth만) 공통 설정 로더가
            # 운영에서 필수로 검증한다 — 미설정이면 부팅에 실패한다.
            - name: PRISM_WEB_APP_URL
              value: {{ .Values.env.webAppUrl | quote }}
            # 세션 쿠키 이름 네임스페이스 — auth와 같은 값이어야 쿠키를 찾는다.
            - name: PRISM_COOKIE_NAMESPACE
              value: {{ .Values.env.cookieNamespace | quote }}
            # 세션 검증용 — auth가 발급한 토큰을 같은 키·같은 저장소로 확인한다.
            - name: PRISM_JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-socket.fullname" . }}-secret
                  key: jwt-secret-key
            - name: PRISM_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-socket.fullname" . }}-secret
                  key: redis-url
            # ICE 서버 — 통화가 성립할 때 클라이언트에게 그대로 내려간다.
            # 비어 있으면 서버가 공개 STUN 하나로 떨어진다(TURN 없음).
            - name: PRISM_STUN_URLS
              value: {{ .Values.ice.stunUrls | quote }}
            - name: PRISM_TURN_URLS
              value: {{ .Values.ice.turnUrls | quote }}
            # 클라이언트에게 나가는 것은 이 비밀이 아니라, 통화마다 이것으로 서명한
            # 시한부 자격증명이다(libs/config/src/config.service.ts).
            - name: PRISM_TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-socket.fullname" . }}-secret
                  key: turn-secret
            # 푸시. 셋이 함께 있거나 함께 없어야 한다 — 비공개 키만 Secret에서 온다.
            - name: PRISM_FCM_PROJECT_ID
              value: {{ .Values.fcm.projectId | quote }}
            - name: PRISM_FCM_CLIENT_EMAIL
              value: {{ .Values.fcm.clientEmail | quote }}
            - name: PRISM_FCM_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "prism-socket.fullname" . }}-secret
                  key: fcm-private-key
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          # ⚠️ readiness는 /readyz다(liveness의 /healthz와 다르다).
          # 이 서비스는 Redis 없이는 아무 일도 못 하는데 프로세스는 살아 있으므로,
          # 둘 다 /healthz를 보면 Redis가 끊긴 파드가 계속 트래픽을 받는다 —
          # 그러면 모든 세션이 조용히 "연결 없음"으로 보인다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
