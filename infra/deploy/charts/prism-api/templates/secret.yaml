apiVersion: v1
kind: Secret
metadata:
  name: {{ include "prism-api.fullname" . }}-secret
  labels:
    {{- include "prism-api.labels" . | nindent 4 }}
type: Opaque
data:
  # api는 세션을 **발급하지 않지만 검증한다.** auth와 같은 키·같은 저장소를 봐야 하며,
  # 하나라도 갈리면 "auth에서는 로그인되는데 api는 전부 401"이 된다.
  jwt-secret-key: {{ required "PRISM_JWT_SECRET_KEY must be set" .Values.jwt.secretKey | b64enc | quote }}
  # 세션 생존 확인이 매 요청 일어나므로 세션 저장소는 필수다.
  redis-url: {{ required "PRISM_REDIS_URL must be set" .Values.redis.url | b64enc | quote }}
  # 접속 URL은 비밀번호를 포함하므로 통째로 Secret (Heroku/RDS식 DATABASE_URL 관례)
  database-url: {{ .Values.database.url | default "" | b64enc | quote }}
  database-replica-urls: {{ .Values.database.replicaUrls | default "" | b64enc | quote }}
