# =============================================================================
# coturn — WebRTC TURN/STUN 서버
# =============================================================================
# 이 파일은 **환경에 무관한 값만** 담는다. realm·자격증명·공인 IP·릴레이 포트 범위처럼
# 환경마다 다르거나 민감한 값은 `entrypoint.sh`가 env에서 읽어 뒤에 덧붙인다.
# 레포에 도메인·비밀번호를 넣지 않기 위한 분리이고, 그래서 이 파일만으로는 기동하지
# 않는다(realm과 사용자 줄이 없다).
# =============================================================================

# -----------------------------------------------------------------------------
# 리스닝
# -----------------------------------------------------------------------------
# 컨테이너 안의 포트는 고정이다 — 호스트에 어떤 포트로 낼지는 compose가 정한다.
listening-port=3478
# TLS/DTLS. 인증서를 마운트해야 실제로 열린다(entrypoint.sh가 certs/를 본다).
tls-listening-port=5349

# -----------------------------------------------------------------------------
# 인증 — 시한부 자격증명(TURN REST, `use-auth-secret`)
# -----------------------------------------------------------------------------
# **정적 `user=`를 쓰지 않는다.** 자격증명은 통화 수락과 함께 클라이언트에게 그대로
# 내려가므로, 고정값이면 통화를 한 번 성사시킨 사람이 그 값을 영구히 쥔다 — 세션을
# 폐기해도 로그아웃해도 릴레이가 열려 있다.
#
# 대신 사용자명을 `<만료 unix>:<식별자>`로, 비밀번호를 그 사용자명의 HMAC-SHA1(base64)로
# 만든다. coturn은 사용자 목록 없이 공유 비밀 하나로 검증하고, 만료가 지나면 거절한다.
# 발급하는 쪽은 소켓 서버다(libs/config/src/config.service.ts의 iceServersFor).
#
# `static-auth-secret=` 줄은 entrypoint.sh가 env에서 만든다 — 여기 적으면 레포에 평문이 남는다.
use-auth-secret
# nonce 수명(초). 지나면 클라이언트가 재인증한다.
stale-nonce=600

# -----------------------------------------------------------------------------
# 로깅
# -----------------------------------------------------------------------------
# 파일이 아니라 stdout으로 — `docker logs coturn` 하나만 보면 되게. (개발 환경의
# 원본은 /var/log/coturn/turnserver.log로 떨궈서 컨테이너에선 아무것도 안 보였다.)
log-file=stdout

# -----------------------------------------------------------------------------
# 보안
# -----------------------------------------------------------------------------
# STUN 메시지 무결성 검증(RFC 5389 권장).
fingerprint
# 멀티캐스트 주소로의 릴레이 차단.
no-multicast-peers
# 런타임 제어 CLI(기본 telnet 2601) 비활성 — 노출된 서버에서 켜 둘 이유가 없다.
no-cli
# 취약한 TLS 버전 차단.
no-tlsv1
no-tlsv1_1

# -----------------------------------------------------------------------------
# 사용량 제한
# -----------------------------------------------------------------------------
# 릴레이는 우리 대역폭을 쓴다 — 자격증명이 새더라도 피해가 유한하도록 상한을 둔다.
# 1:1 통화 하나가 쓰는 할당은 피어당 1개다.
#
# `user-quota`는 **사용자명 단위**다. 정적 자격증명이었을 때는 사용자명이 하나뿐이라
# 이 값이 배포 전체의 동시 할당 상한이었다(대칭 NAT 사용자 몇 명이면 소진됐다).
# 시한부 자격증명은 발급마다 사용자명이 달라 실제로 통화 단위 상한이 된다.
user-quota=12
total-quota=1200
