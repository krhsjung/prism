networks:
  default:
    name: coturn
    external: false

services:
  coturn:
    image: coturn/coturn:${COTURN_VERSION}
    container_name: coturn
    restart: unless-stopped
    ports:
      # redis와 반대로 루프백에 묶지 않는다 — TURN은 밖에서 닿는 것이 기능이다.
      # 공유기에서 이 포트들을 이 호스트로 포워딩해야 실제로 쓰인다.
      - "${COTURN_LISTENING_PORT}:3478/udp"
      - "${COTURN_LISTENING_PORT}:3478/tcp"
      - "${COTURN_TLS_PORT}:5349/udp"
      - "${COTURN_TLS_PORT}:5349/tcp"
      # 릴레이 포트. 컨테이너가 클라이언트에게 **자기가 아는 포트 번호를** 알려 주므로
      # 호스트/컨테이너 번호가 같아야 한다(포트 변환을 끼우면 후보가 어긋난다).
      - "${COTURN_MIN_PORT}-${COTURN_MAX_PORT}:${COTURN_MIN_PORT}-${COTURN_MAX_PORT}/udp"
    environment:
      # 실제 값은 전부 셸 환경 → .env → 여기로 온다. 레포에는 이름만 남는다.
      COTURN_REALM: ${COTURN_REALM}
      COTURN_AUTH_SECRET: ${COTURN_AUTH_SECRET}
      COTURN_EXTERNAL_IP: ${COTURN_EXTERNAL_IP}
      COTURN_RELAY_IP: ${COTURN_RELAY_IP}
      COTURN_MIN_PORT: ${COTURN_MIN_PORT}
      COTURN_MAX_PORT: ${COTURN_MAX_PORT}
      COTURN_ALLOW_PRIVATE_PEERS: ${COTURN_ALLOW_PRIVATE_PEERS}
      COTURN_VERBOSE: ${COTURN_VERBOSE}
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./entrypoint.sh:/usr/local/bin/coturn-entrypoint.sh:ro
      # 인증서는 **호스트의 것을 그대로** 본다(기본값은 이 폴더의 ./certs).
      # 복사본을 두면 갱신된 날 coturn만 옛 인증서를 쥐고 조용히 만료되므로,
      # nginx 등이 쓰는 디렉터리를 COTURN_CERT_DIR로 가리키는 쪽을 권한다.
      - ${COTURN_CERT_DIR}:/etc/coturn/certs:ro
    entrypoint: ["/usr/local/bin/coturn-entrypoint.sh"]
