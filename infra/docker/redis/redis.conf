# 기본 비밀번호 설정
# requirepass redis_password

# ACL 사용자 정의 (user 설정)
# user default off
# user root on >root_password ~* +@all
# user read_only on >read_only_password ~* +@read

# ACL 파일 경로 (docker-compose에서 초기화 스크립트로 생성)
aclfile /data/users.acl

# 키스페이스 알림 — **만료만** 켠다.
#
# socket 서비스가 세션 키의 만료를 듣고, 붙어 있는 기기에 곧바로 목록 변화를 알린다.
# 없으면 20초 스윕이 잡으므로 기능이 깨지지는 않는다 — 지연만 늘어난다.
#
#   K = keyspace 채널(`__keyspace@<db>__:<키>`) — 채널이 **키 이름**이라 구독자가
#       패턴으로 거를 수 있다. E(`__keyevent__`)는 채널이 이벤트 이름이라 못 거른다.
#   x = 만료 이벤트만. 다른 종류(변경·삭제·리스트 연산)는 켜지 않는다.
notify-keyspace-events Kx

# 네트워크 인터페이스 바인딩
# bind 127.0.0.1

# 보호 모드
# protected-mode yes

# 스냅샷 저장
# 900초(15분) 동안 1개의 키라도 변경되면 스냅샷을 저장.
# save 900 1

# RDB 파일 위치와 이름
# RDB 파일이 저장될 디렉터리 경로.
# dir /var/lib/redis
# RDB 스냅샷 파일의 이름을 정의.
# dbfilename dump.rdb

# AOF 설정
# AOF 파일을 활성화하여 모든 쓰기 작업을 디스크에 기록.
# appendonly yes
# AOF 파일의 이름을 정의.
# appendfilename "appendonly.aof"
# AOF 파일을 매 초마다 디스크에 기록. 성능과 데이터 안정성의 균형을 맞출 수 있습니다.
# appendfsync everysec

# auto-aof-rewrite-percentage 및 auto-aof-rewrite-min-size
# AOF 파일 크기가 기존 크기보다 100% 증가하거나 파일 크기가 64MB를 초과하면 AOF 파일을 압축.
# auto-aof-rewrite-percentage 100
# auto-aof-rewrite-min-size 64mb

# 최대 메모리 사용량
# maxmemory 2gb

# 메모리 부족 시 정책
# noeviction: 더 이상 데이터를 추가할 수 없게 됨.
# allkeys-lru: 전체 키에서 가장 오랫동안 사용되지 않은 데이터를 제거(LRU: Least Recently Used).
# volatile-lru: 만료가 설정된 키 중에서 LRU 방식으로 제거.
# allkeys-random: 전체 키에서 랜덤하게 제거.
# volatile-random: 만료가 설정된 키 중에서 랜덤하게 제거.
# maxmemory-policy allkeys-lru

# 포트 설정
# port 6379

# tcp-backlog
# 이 설정은 커넥션 큐의 길이를 설정합니다. 높은 트래픽 상황에서 연결 요청을 관리하는 데 사용됩니다.
# tcp-backlog 511

# 로그 레벨을 설정
# debug, verbose, notice, warning 중 선택.
# loglevel notice

# 로그 파일을 저장할 경로
# logfile /var/log/redis/redis-server.log

# 데몬 프로세스로 실행할지 설정
# 이 옵션이 yes로 설정되면, Redis가 백그라운드에서 실행됩니다. 일반적으로 시스템 서비스로 사용할 때 유용합니다.
# daemonize yes

# Redis는 기본적으로 16개의 데이터베이스를 제공합니다. 이 설정을 통해 데이터베이스의 수를 조정할 수 있습니다.
# Redis는 0번부터 시작하는 여러 데이터베이스를 지원합니다. 각 데이터베이스는 독립된 네임스페이스를 갖습니다.
# databases 16